[package]
name = "gglab-shader-graph-editor"
version = "0.1.0"
description = "Thin desktop host for the GGLab Shader Graph Editor web frontend, plus the ShaderToolService process boundary."
edition = "2021"

# Five bounded responsibilities in one crate:
#
# - the thin desktop shell (main.rs): it hosts the React/Vite frontend and
#   owns the official dialog and scoped-fs plugins for auxiliary reads;
# - the native document service: host-owned Open/Save As selection, canonical
#   URI capabilities, exact revisioned snapshots, and CAS atomic save;
# - the native Workspace service: host-owned root selection, bounded recursive
#   discovery, canonical containment, cancellation, and refresh observations;
# - the Environment service: host-selected repositories and guarded read-only
#   producer discovery with bounded output, cancellation, and strict IPC decoding;
# - the ShaderToolService (src/shader_tool/): the host-side implementation
#   of the toolchain client's declared host boundary — exactly six tool
#   allowlisted capabilities (discover / handshake / preview-handshake /
#   compile / build-preview / cancel), plus the separate compiler-free,
#   candidate/session-scoped Runtime observation read,
#   host-internal request validation and invocation serialization (no shell
#   string, no argv in any TypeScript-facing surface), bounded execution
#   (timeout / cancel / whole-output capture), the pre-spawn provenance
#   guard, and private per-attempt staging.
#
# Neither layer knows anything about shader-graph semantics, profile
# versions, or readiness: the client package declares the machine protocol
# and interprets the raw output; this service executes and reports raw
# facts. Design authority: docs/GGLab_Shader_Toolchain_Integration_Design.md
# (sections 9 and 10).

[lib]
name = "gglab_shader_graph_editor"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
