[package]
name = "gglab-shader-graph-editor"
version = "0.1.0"
description = "Thin desktop host for the GGLab Shader Graph Editor web frontend."
edition = "2021"

# This crate is a deliberately thin desktop shell: it hosts the existing
# React/Vite frontend in a native window and owns nothing else. It knows
# nothing about ShaderGraph semantics, profileVersion, descriptor
# compatibility, or HLSL emission — all of that stays in the frontend and
# in shader-graph-core, exactly as in the browser.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
