packages:
  - "apps/*"
  - "packages/*"

# Pin the pnpm content-addressed store inside this repository root (relative
# path, resolved from here; run pnpm from the repository root). The store
# stays on the project volume, which Windows hard-linked node_modules require;
# this also removes the cross-volume fallback that places the store at the
# drive root, and no machine-specific path is committed. The store directory
# is ignored by .gitignore.
storeDir: .pnpm-store
